services:
  # 1. THE PRODUCTION APPLICATION (TanStack Start SSR)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: factaurant_app
    restart: unless-stopped

# DNS FIX: Use Cloudflare & Google DNS directly
    dns:
      - 1.1.1.1
      - 8.8.8.8

    environment:
      NODE_ENV: production
      PORT: 3000

        # ⚡ Tells Node.js inside Docker to allow Supabase's certificate chain
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      
      # ⚡ SUPABASE CLOUD CONNECTION STRING
      # Passed directly from your .env file
      DATABASE_URL: ${DATABASE_URL}
      
      # Multitenancy & Media Configuration
      APP_MODE: ${APP_DEPLOYMENT_MODE:-SHARED}
      SINGLE_TENANT_ID: ${SINGLE_TENANT_ID}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_DOMAIN: ${R2_PUBLIC_DOMAIN}
      VITE_CDN_URL: ${VITE_CDN_URL}
    networks:
      - factaurant_network

  # 2. NGINX REVERSE PROXY & GATEWAY (SSL + Wildcards + Compression)
  nginx:
    image: nginx:alpine
    container_name: factaurant_gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - factaurant_network

networks:
  factaurant_network:
    driver: bridge