# docker-compose.yml (create in project root, alongside package.json)
services:
  db_test:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: factaurant_test
    ports:
      - "5433:5432"  # different port so it never clashes with anything else
    volumes:
      - pgdata_test:/var/lib/postgresql/data

volumes:
  pgdata_test: